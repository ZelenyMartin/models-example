- title: Povídky malostranské – Týden v tichém domě
  author: Jan Neruda
  genre: prose
  text: >
    Cítíme, že jsme v místnosti zcela uzavřené. Čirá, hluboká kolem nás tma, ani
    nejmenší skulinou nevniká odnikud šero; všude jen tma taková, v níž domníváme-li
    se přec na okamžik míti něco světlého před očima, je to pouze rudý kruh vlastní
    naší myšlenky.
- title: Osudy dobrého vojáka Švejka za světové války
  author: Jaroslav Hašek
  genre: prose
  text: >
    „Tak nám zabili Ferdinanda,“ řekla posluhovačka panu Švejkovi, který opustiv
    před léty vojenskou službu, když byl definitivně prohlášen vojenskou lékařskou
    komisí za blba, živil se prodejem psů, ošklivých nečistokrevných oblud, kterým
    padělal rodokmeny. Kromě tohoto zaměstnání byl stižen revmatismem a mazal si
    právě kolena opodeldokem.
- title: Tři zlaté vlasy Děda-Vševěda
  author: Karel Jaromír Erben
  genre: prose
  text: >
    Bylo — nebylo: byl jednou jeden král, který se rád honil po lesích za zvěří.
    Jednou taky se pustil daleko za jelenem a zabloudil. Byl sám a sám, přišla noc a
    král byl rád, že našel na mýtině chalupu. Zůstával tam uhlíř. Král povídá,
    jest-li by ho chtěl z lesa na cestu vyvest? že mu dobře zaplatí. — „I rád bych
    s vámi,“ řekl uhlíř, „ale tu vidíte, žena se mi právě čeká, nemohu odejít. A
    kam byste taky v noci? Lehněte si na půdu na seno, a ráno vás doprovodím.“
- title: Zlatovláska
  author: Karel Jaromír Erben
  genre: prose
  text: >
    Byl jeden král, a byl tak rozumný, že i všem živočichům rozuměl, co si povídali.
    A poslouchejte, jak se tomu naučil. Přišla k němu jednou nějaká stará babička,
    přinesla mu v košíku hada a povídá, aby si ho dal ustrojit: když ho sní, že bude
    všemu rozumět, co které zvíře v povětří, na zemi i ve vodě mluví.
