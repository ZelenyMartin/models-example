- title: Naši furianti
  author: Ladislav Stroupežnický
  genre: drama
  text:
    - Bláha: Dej pámbu dobrej večer, Josefe!
    - Habršperk: Dejž to pámbu, Valentýnku!
    - Bláha: No, co děláš, kamaráde?
- title: Lucerna
  author: Alois Jirásek
  genre: drama
  text:
    - Mlynář: Babičko, jste tady?
    - Babička: Jsem, chceš něco?
    - Mlynář: Prosím vás —
    - Babička: Co pak hochu, co —
    - Mlynář: Abyste mně tuhle pověděla. Já tady ke kronice připisuju staré proroctví, jak je říkáváte, píšu si to, aby ostalo pro pamět.
- title: R.U.R.
  author: Karel Čapek
  genre: drama
  text:
    - Domin: Nový list. Friedrichswerke, Hamburk. Datum. Potvrzujeme objednávku patnáct tisíc Robotů.
    - Sulla: Potvrzujeme objednávku na patnáct tisíc R.
    - Domin: (zamyšleně) Patnáct tisíc R. Patnáct tisíc R.
    - Marius: Pane řediteli, nějaká dáma prosí.
    - Domin: Kdo?
    - Marius: Nevím. Podává vizitku.
    - Domin: (čte) Prezident Glory. Že prosím.
    - Marius: Račte, paní.
    - Helena: Pan centrální ředitel Domin?
